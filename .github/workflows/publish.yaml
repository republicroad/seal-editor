name: Publish version
on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    if: "startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Build
        run: pnpm run build

      # lerna/npm publish leaves pnpm `catalog:` specifiers unrewritten in the
      # published manifest (0.3.2/0.1.0 shipped with unresolvable deps).
      # pnpm publish replaces them with the real versions from
      # pnpm-workspace.yaml. The guard replicates lerna's from-package
      # semantics: skip versions already present in the registry.
      - name: Publish unpublished packages
        shell: bash
        run: |
          for pkg in packages/*; do
            name=$(node -p "require('./$pkg/package.json').name")
            ver=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$ver" version > /dev/null 2>&1; then
              echo "[publish] $name@$ver already in registry — skip"
            else
              pnpm --filter "$name" publish --access public --no-git-checks
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm's staged-publish pipeline can hold freshly accepted tarballs for
      # 15+ minutes (observed 2026-09-25 on 1.2.0/1.3.0) before the exact
      # -version endpoint answers; the old 5-minute kernel-only wait produced
      # spurious red runs. Poll ALL published package versions with a 20-min
      # global budget before smoking.
      - name: Wait for registry propagation
        run: |
          specs=()
          for pkg in packages/*; do
            name=$(node -p "require('./$pkg/package.json').name")
            ver=$(node -p "require('./$pkg/package.json').version")
            specs+=("$name@$ver")
          done
          remaining=("${specs[@]}")
          for i in $(seq 1 120); do
            left=()
            for spec in "${remaining[@]}"; do
              if npm view "$spec" version > /dev/null 2>&1; then
                echo "registry visible: $spec (attempt $i)"
              else
                left+=("$spec")
              fi
            done
            if [ ${#left[@]} -eq 0 ]; then
              echo "all published versions visible"
              exit 0
            fi
            remaining=("${left[@]}")
            sleep 10
          done
          echo "still not visible after 20min: ${remaining[*]}"
          exit 1

      - name: Registry smoke (published artifact shape)
        run: pnpm test:npm-smoke "$(node -p "require('./packages/seal-editor/package.json').version")"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
