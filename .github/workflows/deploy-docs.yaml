name: Deploy Storybook + Docs to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/seal-editor/src/**'
      - 'packages/seal-editor/.storybook/**'
      - 'packages/seal-editor/vite.config.ts'
      - 'packages/seal-editor/package.json'
      - 'packages/appshell/src/**'
      - 'docs/**'
      - 'rspress.config.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build kernel dist
        run: pnpm --filter @republicroad/seal-editor build
      - name: Build Storybook
        run: pnpm --filter @republicroad/seal-editor build:storybook
      - name: Build Rspress docs
        run: pnpm exec rspress build
      - name: Merge artifacts (Storybook root + Rspress docs/)
        run: |
          SITE=$(mktemp -d)
          cp -r packages/seal-editor/docs/* "$SITE/"
          mkdir -p "$SITE/docs"
          cp -r doc-out/* "$SITE/docs/"
          # wasm for expression evaluation in the docs-site live demo
          mkdir -p "$SITE/docs/zen-engine-wasm"
          cp packages/seal-editor/node_modules/@gorules/zen-engine-wasm/dist/zen_engine_wasm_bg.wasm "$SITE/docs/zen-engine-wasm/"
          touch "$SITE/.nojekyll"
          echo "SITE=$SITE" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE }}
      - id: deployment
        uses: actions/deploy-pages@v4
