name: Version
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: true

      - name: Lint and prettier
        run: pnpm format

      - name: Version
        run: pnpm lerna version ${{ github.event.inputs.version }} --yes
        env:
          GIT_AUTHOR_NAME: 'Bot'
          GIT_AUTHOR_EMAIL: 'bot@republicroad.io'
          GIT_COMMITTER_NAME: 'Bot'
          GIT_COMMITTER_EMAIL: 'bot@republicroad.io'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
