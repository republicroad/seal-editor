name: Validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest 自 2026-10-19 起迁移 Ubuntu 26——显式钉 24.04 保持体积/行为基线稳定（迁移计划见 docs/design/ubuntu-26-migration.md，暂不开启）
    # 基线稳定；迁移 26 单独立校准任务处理（体积预算需重测）。
    runs-on: ubuntu-24.04
    name: Validate
    steps:
      - uses: actions/checkout@v5
      # demo-server 的测试跑 bun test（apps 工具链），CI 显式装 Bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "store-dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store-dir }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and prettier
        run: pnpm format

      - name: React Compiler readiness
        run: pnpm lint:compiler

      - name: Style-debt budget (!important / raw-hex caps)
        run: pnpm lint:debt

      - name: Build
        run: pnpm build

      # lerna scope is packages/* only (lerna.json) — the demo apps are
      # registry-pinned consumers and must stay outside the version loop,
      # but their builds still gate on CI explicitly
      - name: Build demo apps
        run: pnpm -r --filter "./apps/**" run build

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Demo-server typecheck（bun types 口径，res.json() 返回 unknown）
        run: pnpm --filter @republicroad/demo-server typecheck

      - name: Demo-server tests（bun test：REPL 端点契约 + graph API）
        run: pnpm --filter @republicroad/demo-server test

      - name: Appshell typecheck
        run: pnpm --filter @republicroad/seal-appshell typecheck
      - name: Appshell tests
        run: pnpm --filter @republicroad/seal-appshell test
      - name: Appshell build
        run: pnpm --filter @republicroad/seal-appshell build

      - name: Bundle size budget
        run: pnpm size

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook interaction suite (incl. geometry parity guard)
        run: pnpm --filter @republicroad/seal-editor test:storybook

      - name: E2E smoke (playwright: dt editing / dock / UDF completion)
        run: pnpm --filter @republicroad/e2e test

      - name: Consumer smoke (react 18 & 19)
        run: pnpm test:consumer
